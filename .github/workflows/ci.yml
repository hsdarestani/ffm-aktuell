name: FFM Aktuell CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffm
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ffm_activation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffm -d ffm_activation_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Install Chromium for map recovery checks
        run: npx playwright install --with-deps chromium
      - name: Mobile map startup and stalled-network recovery
        run: npm run test:map-browser
      - name: Map recovery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-startup-browser
          path: artifacts/map-startup
          if-no-files-found: ignore
      - name: Admin activation end-to-end on temporary PostgreSQL
        env:
          ACTIVATION_CI_DATABASE_URL: postgres://ffm:ci-only@127.0.0.1:5432/ffm_activation_ci
        run: node scripts/ci-admin-activation-e2e.mjs
      - name: Rehearse isolated PostgreSQL backup and restore
        env:
          ACTIVATION_CI_DATABASE_URL: postgres://ffm:ci-only@127.0.0.1:5432/ffm_activation_ci
          FFM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/ci-backup-restore.mjs
      - name: Validate compose
        run: |
          printf 'POSTGRES_PASSWORD=ci-only\nSESSION_SECRET=ci-only-long-session-key\n' > .env
          docker compose config -q

