name: ffm-aktuell
services:
  db:
    container_name: ffm-aktuell-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ffm
      POSTGRES_USER: ffm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password missing}
    volumes:
      - ffm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffm -d ffm"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
  web:
    container_name: ffm-aktuell-web
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ffm:${POSTGRES_PASSWORD}@ffm-aktuell-db:5432/ffm
      SESSION_SECRET: ${SESSION_SECRET:?Session secret missing}
      NEXT_PUBLIC_SITE_URL: https://ffm-aktuell.smarbiz.sbs
      NODE_ENV: production
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      FFM_MEDIA_DIR: /app/uploads
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      APPLE_SERVICE_ID: ${APPLE_SERVICE_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FFM_EMAIL_FROM: ${FFM_EMAIL_FROM:-}
    volumes:
      - ffm_media:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - shared
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s
networks:
  shared:
    name: ${PUBLISHER_NETWORK:-aplus-publisher_default}
    external: true
volumes:
  ffm_db:
  ffm_media:
